<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The Nimbus backend must run as root: hostapd, dnsmasq, nft and
       `iw reg set` all need CAP_NET_ADMIN. Clients never call it directly on
       the bus; they go through the desktop application. -->
  <policy user="root">
    <allow own="com.nimbus.Hotspot"/>
    <allow send_destination="com.nimbus.Hotspot"/>
    <allow receive_sender="com.nimbus.Hotspot"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.nimbus.Hotspot"/>
    <allow receive_sender="com.nimbus.Hotspot"/>
  </policy>
</busconfig>
