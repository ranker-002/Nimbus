[workspace]
resolver = "2"
members = [
    "nimbus-core",
    "nimbus-network",
    "nimbus-wifi",
    "nimbus-settings",
    "nimbus-telemetry",
    "nimbus-backend",
    "nimbus-cli",
    "nimbus-dbus-api",
    "nimbus-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Nimbus Contributors"]
repository = "https://github.com/nimbus-hotspot/nimbus"
description = "Modern Wi-Fi hotspot manager for Linux"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "signal"] }
async-channel = "2"
async-trait = "0.1"
futures = "0.3"

# GTK4 / Libadwaita
gtk = { version = "0.10", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_6"] }
glib = "0.20"
gio = "0.20"

# NetworkManager
nmrs = "3.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# QR Code
qrcode = "0.14"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# MAC lookup
mac_address = { version = "1.1", features = ["serde"] }

# Testing
mockall = "0.13"
tempfile = "3"

# D-Bus
zbus = { version = "5", default-features = false, features = ["tokio"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# OnceLock (for runtime singleton)
once_cell = "1"
